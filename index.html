<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة السنوية الثامنة - مجددون</title>
    <style>
        :root {
            --navy: #0A192F;
            --gold: #D4AF37;
            --ivory: #FDFBF7;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--navy);
            color: var(--navy);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ticket-card {
            background-color: var(--ivory);
            border: 2px solid var(--gold);
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--gold);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--navy);
            margin: 0;
            font-size: 24px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .flight-info {
            background-color: var(--navy);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--navy);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--white);
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .vip-badge {
            background-color: var(--gold);
            color: var(--navy);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 5px;
            display: none;
            font-weight: bold;
        }

        .submit-btn {
            background-color: var(--gold);
            color: var(--navy);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #b89528;
            color: var(--white);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="ticket-card">
    <div class="header">
        <h1>✈️ بطاقة صعود الطائرة | Flight #8</h1>
        <p>السنوية الثامنة لمجددون - ثمان سنوات من الأثر</p>
    </div>

    <div class="flight-info">
        الرحلة: 21/11/2026 | وقت الإقلاع: 02:00 مساءً
    </div>

    <form id="boardingForm">
        <div class="form-group">
            <label for="name">
                اسم المسافر الثلاثي:
                <span id="vipBadge" class="vip-badge">✨ تم التعرف عليك كـ VIP</span>
            </label>
            <input type="text" id="name" placeholder="اكتب اسمك الثلاثي هنا..." required oninput="checkVipName()">
        </div>

        <div class="form-group">
            <label for="phone">رقم الواتساب:</label>
            <input type="tel" id="phone" placeholder="07xxxxxxxx" required>
        </div>

        <div class="form-group">
            <label for="category">الفئة التطوعية:</label>
            <select id="category" required>
                <option value="">اختر الفئة...</option>
                <option value="old">متطوع قديم (أكثر من 3 سنوات)</option>
                <option value="active">متطوع حالي</option>
                <option value="guest">ضيف</option>
                <option value="charity_central">الهيئة الخيرية / المركزي</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">مكان السكن:</label>
            <select id="location" required>
                <option value="">اختر المنطقة...</option>
                <option value="salt">السلط</option>
                <option value="basha">عين الباشا / صفوط</option>
                <option value="sweileh">صويلح</option>
                <option value="amman_north">طبربور / ماركا</option>
                <option value="amman_center">وسط البلد / السابع / عبدون</option>
                <option value="other">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="seat">اختيار درجتك ومقعدك:</label>
            <select id="seat" required>
                <option value="">اختر المقعد...</option>
                
                <!-- مقاعد VIP (مخفية بشكل افتراضي وتظهر لأسماء VIP فقط) -->
                <optgroup label="⭐ الدرجة الأولى (VIP Seats)" id="vipGroup" style="display: none;">
                    <option value="VIP-01">مقعد VIP - 01</option>
                    <option value="VIP-02">مقعد VIP - 02</option>
                    <option value="VIP-03">مقعد VIP - 03</option>
                    <option value="VIP-04">مقعد VIP - 04</option>
                    <option value="VIP-05">مقعد VIP - 05</option>
                    <option value="VIP-06">مقعد VIP - 06</option>
                    <option value="VIP-07">مقعد VIP - 07</option>
                </optgroup>

                <!-- 25 مقعد اقتصادية للجميع -->
                <optgroup label="✈️ الدرجة الاقتصادية (Economy Seats)">
                    <option value="Eco-01">مقعد إيكونومي - 01</option>
                    <option value="Eco-02">مقعد إيكونومي - 02</option>
                    <option value="Eco-03">مقعد إيكونومي - 03</option>
                    <option value="Eco-04">مقعد إيكونومي - 04</option>
                    <option value="Eco-05">مقعد إيكونومي - 05</option>
                    <option value="Eco-06">مقعد إيكونومي - 06</option>
                    <option value="Eco-07">مقعد إيكونومي - 07</option>
                    <option value="Eco-08">مقعد إيكونومي - 08</option>
                    <option value="Eco-09">مقعد إيكونومي - 09</option>
                    <option value="Eco-10">مقعد إيكونومي - 10</option>
                    <option value="Eco-11">مقعد إيكونومي - 11</option>
                    <option value="Eco-12">مقعد إيكونومي - 12</option>
                    <option value="Eco-13">مقعد إيكونومي - 13</option>
                    <option value="Eco-14">مقعد إيكونومي - 14</option>
                    <option value="Eco-15">مقعد إيكونومي - 15</option>
                    <option value="Eco-16">مقعد إيكونومي - 16</option>
                    <option value="Eco-17">مقعد إيكونومي - 17</option>
                    <option value="Eco-18">مقعد إيكونومي - 18</option>
                    <option value="Eco-19">مقعد إيكونومي - 19</option>
                    <option value="Eco-20">مقعد إيكونومي - 20</option>
                    <option value="Eco-21">مقعد إيكونومي - 21</option>
                    <option value="Eco-22">مقعد إيكونومي - 22</option>
                    <option value="Eco-23">مقعد إيكونومي - 23</option>
                    <option value="Eco-24">مقعد إيكونومي - 24</option>
                    <option value="Eco-25">مقعد إيكونومي - 25</option>
                </optgroup>
            </select>
        </div>

        <button type="submit" class="submit-btn">تأكيد حجز التذكرة والمقعد 🎟️</button>
    </form>

    <div class="footer-note">
        * المقاعد محدودة جداً وتُحجز بأسبقية التسجيل. الدعوة مجانية بالكامل.
    </div>
</div>

<script>
    // قائمة أسماء الـ VIP المصرح لهم بظهور المقاعد الفاخرة
    const vipNames = ["رغد", "لارا", "سجى"];

    function checkVipName() {
        const inputName = document.getElementById("name").value.trim();
        const vipGroup = document.getElementById("vipGroup");
        const vipBadge = document.getElementById("vipBadge");

        // الفحص إذا الاسم يشتمل على أحد الأسماء المصرحة
        const isVip = vipNames.some(name => inputName.includes(name));

        if (isVip) {
            vipGroup.style.display = "block";
            vipBadge.style.display = "inline-block";
        } else {
            vipGroup.style.display = "none";
            vipBadge.style.display = "none";
            
            // إذا كان اختار مقعد VIP وتم تغيير الاسم لاسم عادي، يعيد ضبط الاختيار
            const seatSelect = document.getElementById("seat");
            if (seatSelect.value.startsWith("VIP")) {
                seatSelect.value = "";
            }
        }
    }
</script>

</body>
</html>
