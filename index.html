<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة السنوية الثامنة - مجددون</title>
    <style>
        :root {
            --navy: #0A192F;
            --gold: #D4AF37;
            --ivory: #FDFBF7;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--navy);
            color: var(--navy);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ticket-card {
            background-color: var(--ivory);
            border: 2px solid var(--gold);
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--gold);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--navy);
            margin: 0;
            font-size: 24px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .flight-info {
            background-color: var(--navy);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--navy);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--white);
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .submit-btn {
            background-color: var(--gold);
            color: var(--navy);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #b89528;
            color: var(--white);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="ticket-card">
    <div class="header">
        <h1>✈️ بطاقة صعود الطائرة | Flight #8</h1>
        <p>السنوية الثامنة لمجددون - ثمان سنوات من الأثر</p>
    </div>

    <div class="flight-info">
        الرحلة: 21/11/2026 | وقت الإقلاع: 02:00 مساءً
    </div>

    <form id="boardingForm">
        <div class="form-group">
            <label for="name">اسم المسافر الثلاثي:</label>
            <input type="text" id="name" placeholder="اكتب اسمك كما تحب أن يظهر على المقعد" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم الواتساب:</label>
            <input type="tel" id="phone" placeholder="07xxxxxxxx" required>
        </div>

        <div class="form-group">
            <label for="category">الفئة التطوعية:</label>
            <select id="category" required>
                <option value="">اختر الفئة...</option>
                <option value="vip">متطوع سابق / الرعيل الأول (VIP)</option>
                <option value="active">متطوع حالي / فعال</option>
                <option value="new">متطوع جديد</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">مكان السكن:</label>
            <select id="location" required>
                <option value="">اختر المنطقة...</option>
                <option value="salt">السلط</option>
                <option value="basha">عين الباشا / صفوط</option>
                <option value="sweileh">صويلح</option>
                <option value="amman_north">طبربور / ماركا</option>
                <option value="amman_center">وسط البلد / السابع / عبدون</option>
                <option value="other">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="seat">اختيار درجتك ومقعدك:</label>
            <select id="seat" required>
                <option value="">اختر المقعد...</option>
                <option value="VIP-01">First Class VIP - مقعد 01</option>
                <option value="VIP-02">First Class VIP - مقعد 02</option>
                <option value="A-01">Economy Class - مقعد A01</option>
                <option value="A-02">Economy Class - مقعد A02</option>
                <option value="B-01">Economy Class - مقعد B01</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">تأكيد حجز التذكرة والمقعد 🎟️</button>
    </form>

    <div class="footer-note">
        * المقاعد محدودة جداً وتُحجز بأسبقية التسجيل. الدعوة مجانية بالكامل.
    </div>
</div>

</body>
</html>
